name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The plugin runs wherever Claude Code runs, so the unit tests run on all three.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # dist/server.js is committed because Claude Code installs plugins by cloning with no
      # build step, so a stale bundle would ship broken code.
      - run: npm run build
      - run: npm run check:dist
