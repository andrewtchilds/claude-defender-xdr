name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # libsecret is required to build keytar, a native dependency of
      # @azure/msal-node-extensions.
      - name: Install libsecret
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      # dist/ is committed for plugin distribution, so it must match server/.
      - name: Verify committed build is current
        run: |
          npm run build
          git diff --exit-code -- dist
