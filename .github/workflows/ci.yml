name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # dist/server.js is committed because Claude Code installs plugins by cloning with no
      # build step, so a stale bundle would ship broken code.
      - run: npm run build
      - run: npm run check:dist
